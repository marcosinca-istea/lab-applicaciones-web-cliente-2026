<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Commerce - Scorpion</title>
    <link rel="icon" href="./src/assets/logo.jpeg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="./src/css/global.css">
    <link rel="stylesheet" href="./src/css/navbar.css" />
    <link rel="stylesheet" href="./src/css/cart.css" />
  </head>
  <body>
    <!-- Contenedor de Marcos (Navbar, Categorías y Buscador) -->
    <header id="navbar-container"></header>

    <!-- Contenedor de Grisel (Grilla de Productos) -->
    <main class="container my-5" id="products-container">
      <div class="row row-cols-1 row-cols-md-4 g-5 mt-4" id="products-list">
        <!--desde js-->
      </div>

      <!--Modal-->
      <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true"></div>
    </main>

    <!-- Contenedor de Agustina (Sidebar del Carrito) -->
    <aside id="cart-sidebar-container"></aside>

    <!-- Footer Semántico -->
    <footer class="text-white text-center py-3 mt-auto" style="background-color: var(--color-dark);">
        <p class="mb-0">&copy; 2026 Scorpion E-Commerce - Grupo 6</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script Principal -->
    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
