<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorpion | E-Commerce</title>
    <link rel="icon" href="./src/assets/logo.jpeg" type="image/jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./src/css/global.css">
    <link rel="stylesheet" href="./src/css/navbar.css">
    <link rel="stylesheet" href="./src/css/cards.css">
    <link rel="stylesheet" href="./src/css/cart.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Contenedor de Marcos: Header y Navbar -->
    <header id="navbar-container" class="sticky-top"></header>

    <!-- Contenedor Principal -->
    <main class="container my-5 flex-grow-1">
        <!-- Título de sección dinámico para las búsquedas o categorías -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 id="section-title">Nuestros Productos</h2>
        </div>

        <!-- Contenedor de Grisel: Grilla de Productos -->
        <section id="products-container" class="row g-4">
            <!-- Spinner de carga inicial -->
            <div class="text-center w-100 mt-5" id="loading-spinner">
                <div class="spinner-border" style="color: var(--color-accent);" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
            </div>
        </section>
    </main>

    <!-- Contenedores de Agustina: Modal de Detalles de Producto -->
    <div id="modal-container"></div>

    <!-- Contenedor de Grisel/Agustina: Sidebar del Carrito -->
    <aside id="cart-sidebar-container"></aside>

    <!-- Footer Semántico -->
    <footer class="text-white text-center py-3 mt-auto" style="background-color: var(--color-dark);">
        <p class="mb-0">&copy; 2026 Scorpion E-Commerce - Grupo 6</p>
    </footer>

    <!-- SweetAlert2 (Para las alertas del carrito) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script Principal -->
    <script type="module" src="./src/js/app.js"></script>
</body>
</html>
